spring.application.name=align
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
align.timezone=America/Bogota
align.pending-action.ttl-hours=24

springdoc.swagger-ui.path=/swagger-ui.html
jwt.expiration=24h

# --- Selección de proveedor de LLM (gemini) ---
align.llm.provider=gemini

# --- Gemini (proveedor de LLM, capa gratuita) ---
align.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
#align.gemini.model=gemini-3.7-flash
align.gemini.model=gemini-3.5-flash-lite


# --- Recuperación de contraseña ---
# TTL del link de reset. Corto a propósito: se valida al usarlo, no hace falta
# un job de limpieza.
align.password-reset.ttl-minutes=30

# --- Email (Resend) ---
align.email.base-url=https://api.resend.com
# align.email.api-key (secreto) y align.email.from (remitente verificado en
# Resend) viven en cada profile: dev en application-dev.properties, test dummy
# en application-test.properties, prod por ALIGN_RESEND_API_KEY / ALIGN_EMAIL_FROM.

# --- URL pública del frontend ---
# align.frontend.base-url: base de los links que van en emails (reset de
# contraseña). Por profile, igual que arriba; prod por ALIGN_FRONTEND_BASE_URL.

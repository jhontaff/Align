spring.application.name=align
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=1010
align.timezone=America/Bogota
align.pending-action.ttl-hours=24
spring.profiles.active=dev
springdoc.swagger-ui.path=/swagger-ui.html
jwt.expiration=24h

# --- Selección de proveedor de LLM (gemini) ---
align.llm.provider=gemini

# --- Gemini (proveedor de LLM, capa gratuita) ---
align.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
#align.gemini.model=gemini-3.7-flash
align.gemini.model=gemini-3.5-flash-lite


# --- Cifrado de credenciales de usuario ---
# La master key (align.crypto.secret) vive en cada profile, nunca acá:
# Base64 de 16, 24 o 32 bytes. Si cambia, las keys ya guardadas quedan
# ilegibles y cada usuario tiene que volver a cargar la suya.

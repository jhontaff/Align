spring.application.name=align
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=1010
align.timezone=America/Bogota

springdoc.swagger-ui.path=/swagger-ui.html
jwt.expiration=24h

# --- Selección de proveedor de LLM (gemini) ---
align.llm.provider=gemini

# --- Gemini (proveedor de LLM, capa gratuita) ---
align.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
#align.gemini.model=gemini-3.6-flash
align.gemini.model=gemini-3.1-flash-lite

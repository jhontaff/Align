spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
align.push.vapid.public-key=${ALIGN_PUSH_VAPID_PUBLIC_KEY}
align.push.vapid.private-key=${ALIGN_PUSH_VAPID_PRIVATE_KEY}
align.push.vapid.subject=${ALIGN_PUSH_VAPID_SUBJECT}
jwt.secret=${JWT_SECRET}
align.crypto.secret=${ALIGN_CRYPTO_SECRET}